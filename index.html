<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pendidikan Ekonomi UNIAS</title>

    <!-- SEO -->
    <meta name="description" content="Website resmi Program Studi Pendidikan Ekonomi Universitas Nias">
    <meta name="keywords" content="Pendidikan Ekonomi, UNIAS, Universitas Nias">
    <meta name="author" content="Pendidikan Ekonomi UNIAS">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Pendidikan Ekonomi UNIAS">
    <meta property="og:description" content="Website resmi Program Studi Pendidikan Ekonomi Universitas Nias">
    <meta property="og:image" content="assets/img/LOGO-UNIAS.png">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" href="assets/img/LOGO-UNIAS.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body{
            font-family: 'Poppins', sans-serif;
            background: #f8f8f8;
        }

        .title-font{
            font-family: 'Cinzel', serif;
        }

        .primary-bg{
            background-color: #6B0F1A;
        }

        .gold-text{
            color: #D4AF37;
        }

                .slide{
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: slideShow 16s infinite;
        }
        
        .slide:nth-child(1){
            animation-delay: 0s;
        }
        
        .slide:nth-child(2){
            animation-delay: 4s;
        }
        
        .slide:nth-child(3){
            animation-delay: 8s;
        }
        
        .slide:nth-child(4){
            animation-delay: 12s;
        }
        
        @keyframes slideShow{
            0%{
                opacity: 0;
            }
        
            10%{
                opacity: 1;
            }
        
            25%{
                opacity: 1;
            }
        
            35%{
                opacity: 0;
            }
        
            100%{
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="primary-bg text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">

            <div class="flex items-center gap-3">
                <img src="assets/img/LOGO-UNIAS.png" class="w-12 h-12 rounded-full">

                <div>
                    <h1 class="title-font text-lg font-bold">
                        Pendidikan Ekonomi
                    </h1>

                    <p class="text-sm text-gray-200">
                        Universitas Nias
                    </p>
                </div>
            </div>

            <ul class="hidden md:flex gap-6 font-medium">
                <li><a href="#" class="hover:text-yellow-400">Beranda</a></li>
                <li><a href="#" class="hover:text-yellow-400">Profil</a></li>
                <li><a href="#" class="hover:text-yellow-400">Akademik</a></li>
                <li><a href="#" class="hover:text-yellow-400">Galeri</a></li>
                <li><a href="#" class="hover:text-yellow-400">Kontak</a></li>
            </ul>

        </div>
    </nav>

    <!-- HERO SLIDER -->
    <section class="relative h-screen overflow-hidden">
    
        <!-- Slides -->
        <div class="slides">
    
            <img src="assets/img/slider1.jpg"
                 class="slide active">
    
            <img src="assets/img/slider2.jpg"
                 class="slide">
    
            <img src="assets/img/slider3.jpg"
                 class="slide">
    
            <img src="assets/img/slider4.jpg"
                 class="slide">
    
        </div>
    
        <!-- Overlay -->
        <div class="absolute inset-0 bg-black/60"></div>
    
        <!-- Content -->
        <div class="absolute inset-0 flex items-center justify-center text-center z-10 px-4">
    
            <div>
    
                <h1 class="title-font text-4xl md:text-6xl font-bold text-white mb-6">
                    Program Studi Pendidikan Ekonomi
                </h1>
    
                <p class="text-lg md:text-2xl text-gray-200 mb-8">
                    Membangun Masa Depan Melalui Pendidikan Ekonomi yang Unggul
                </p>
    
                <a href="#"
                   class="bg-yellow-500 hover:bg-yellow-600 text-black px-8 py-3 rounded-full font-semibold transition duration-300">
                    Jelajahi Website
                </a>
    
            </div>
    
        </div>
    
    </section>

</body>
</html>
